<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mockup · anteprima di sviluppo</title>
    <!-- Pagina di sviluppo per rivedere le figure in isolamento. Non è tra gli input del build (vite.config.ts),
         quindi non va pubblicata. Si apre con `npm run dev` su /mockups.html -->
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/mockups.css" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f1f3ea; color: #10261b; font: 500 14px/1.5 system-ui, sans-serif; }
      .board { display: flex; flex-wrap: wrap; gap: 72px; padding: 56px; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { margin-top: 18px; font-size: 13px; color: #3f5a46; letter-spacing: 0.02em; }
      .desk { width: 560px; }
      .phone { width: 342px; }
    </style>
  </head>
  <body>
    <div class="board">
      <figure class="desk"><div class="slot" data-tpl="mk-01-3"></div><figcaption>01 · tappa 3 · prodotto su misura, chiavi in mano · desktop, 560 px</figcaption></figure>
      <figure class="phone"><div class="slot" data-tpl="mk-01-3"></div><figcaption>telefono, colonna da 342 px</figcaption></figure>
      <figure class="desk"><div class="slot" data-tpl="mk-01-1"></div><figcaption>01 · tappa 1 · analisi dei processi (approvato)</figcaption></figure>
      <figure class="desk"><div class="slot" data-tpl="mk-01-2"></div><figcaption>01 · tappa 2 · in produzione (approvato)</figcaption></figure>
    </div>

    <template id="mk-01-3">
      <div class="mk" aria-hidden="true">
        <div class="mk-fit">
          <div class="mk-stage">
            <div class="mk-layer mk-panel mk-app">
              <nav class="mk-side">
                <span class="mk-side-logo"></span>
                <svg class="mk-ico is-on" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
                <svg class="mk-ico" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>
                <svg class="mk-ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                <svg class="mk-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
              </nav>
              <div class="mk-main">
                <div class="mk-flow-head">
                  <div>
                    <div class="mk-k">Applicazione su misura</div>
                    <div class="mk-t">Portale ordini fornitori</div>
                  </div>
                  <span class="mk-pill mk-pill--live">Attivo</span>
                </div>
                <div class="mk-kpis">
                  <div class="mk-kpi"><span class="mk-s">Ordini aperti</span><b>18</b></div>
                  <div class="mk-kpi"><span class="mk-s">In consegna</span><b>7</b></div>
                  <div class="mk-kpi is-hot"><span class="mk-s">Da approvare</span><b>3</b></div>
                </div>
                <div class="mk-orders">
                  <div class="mk-order"><span class="mk-code">#4821</span><div class="mk-b">Minuteria metallica</div><span class="mk-pill mk-pill--run">Da approvare</span></div>
                  <div class="mk-order"><span class="mk-code">#4818</span><div class="mk-b">Imballaggi</div><span class="mk-pill mk-pill--done"><svg class="mk-ico" viewBox="0 0 24 24" style="width:1.1em;height:1.1em"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Confermato</span></div>
                  <div class="mk-order"><span class="mk-code">#4815</span><div class="mk-b">Componenti elettrici</div><span class="mk-pill mk-pill--wait">In consegna</span></div>
                  <div class="mk-order"><span class="mk-code">#4812</span><div class="mk-b">Utensili di ricambio</div><span class="mk-pill mk-pill--wait">In consegna</span></div>
                </div>
              </div>
            </div>

            <div class="mk-panel mk-sources">
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Web</span>
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Mobile</span>
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>Collegato all’ERP</span>
            </div>

            <div class="mk-panel mk-deliver">
              <div class="mk-k">Consegna</div>
              <div class="mk-t">Chiavi in mano</div>
              <ul class="mk-checks">
                <li>Codice e dati del cliente</li>
                <li>Integrato nei sistemi in uso</li>
                <li>Team formato</li>
                <li>Assistenza attiva</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </template>
    <template id="mk-01-1">
      <div class="mk" aria-hidden="true">
        <div class="mk-fit">
          <div class="mk-stage">
            <div class="mk-layer mk-panel mk-flow">
              <div class="mk-flow-head">
                <div>
                  <div class="mk-k">Analisi · Ufficio acquisti</div>
                  <div class="mk-t">Dove l’AI incide</div>
                </div>
                <span class="mk-pill mk-pill--done"><svg class="mk-ico" viewBox="0 0 24 24" style="width:1.1em;height:1.1em"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Analisi completata</span>
              </div>
              <div class="mk-table">
                <div class="mk-thead"><span>Attività</span><span>Volume</span><span>Impatto</span></div>
                <div class="mk-trow is-pick"><div><div class="mk-b">Inserimento ordini da email</div><div class="mk-s">Manuale, ogni giorno</div></div><span class="mk-vol"><i style="width:88%"></i></span><span class="mk-pill mk-pill--high">Alto</span></div>
                <div class="mk-trow"><div><div class="mk-b">Verifica prezzi a listino</div><div class="mk-s">Su ogni ordine</div></div><span class="mk-vol"><i style="width:64%"></i></span><span class="mk-pill mk-pill--mid">Medio</span></div>
                <div class="mk-trow"><div><div class="mk-b">Solleciti ai fornitori</div><div class="mk-s">Settimanale</div></div><span class="mk-vol"><i style="width:40%"></i></span><span class="mk-pill mk-pill--mid">Medio</span></div>
                <div class="mk-trow"><div><div class="mk-b">Archiviazione documenti</div><div class="mk-s">Mensile</div></div><span class="mk-vol"><i style="width:22%"></i></span><span class="mk-pill mk-pill--low">Basso</span></div>
              </div>
            </div>

            <div class="mk-panel mk-sources">
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5M16 4.5a3 3 0 0 1 0 6M18 15c1.6.6 2.7 2.2 3 5"/></svg>Interviste</span>
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>Dati ERP</span>
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v4h4"/></svg>Documenti</span>
            </div>

            <div class="mk-panel mk-goal">
              <div class="mk-k">Obiettivo concordato</div>
              <div class="mk-t">Tempo di evasione ordini</div>
              <div class="mk-rows">
                <div class="mk-row"><span>Misura di partenza</span><b class="mk-ok"><svg class="mk-ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Rilevata</b></div>
                <div class="mk-row"><span>Misura in produzione</span><b>Ogni mese</b></div>
                <div class="mk-row"><span>Compenso</span><b class="mk-accent">Legato al risultato</b></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <template id="mk-01-2">
      <div class="mk" aria-hidden="true">
        <div class="mk-fit">
          <div class="mk-stage">
            <div class="mk-layer mk-panel mk-flow">
              <div class="mk-flow-head">
                <div>
                  <div class="mk-k">Ufficio acquisti</div>
                  <div class="mk-t">Gestione ordini fornitori</div>
                </div>
                <span class="mk-pill mk-pill--live">In produzione</span>
              </div>
              <ol class="mk-steps">
                <li class="mk-step">
                  <span class="mk-node"><svg class="mk-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
                  <div><div class="mk-b">Ricezione ordini</div><div class="mk-s">Email e PDF</div></div>
                  <span class="mk-pill mk-pill--done"><svg class="mk-ico" viewBox="0 0 24 24" style="width:1.1em;height:1.1em"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Completato</span>
                </li>
                <li class="mk-step">
                  <span class="mk-node mk-node--ai"><svg class="mk-ico" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M12 2.5c.7 4.6 3 6.9 7.6 7.6-4.6.7-6.9 3-7.6 7.6-.7-4.6-3-6.9-7.6-7.6 4.6-.7 6.9-3 7.6-7.6Z"/><path d="M19 15.5c.3 1.9 1.2 2.8 3 3.1-1.8.3-2.7 1.2-3 3.1-.3-1.9-1.2-2.8-3-3.1 1.8-.3 2.7-1.2 3-3.1Z"/></svg></span>
                  <div><div class="mk-b">Estrazione dati</div><div class="mk-s">Agente AI</div><div class="mk-bar"><i></i></div></div>
                  <span class="mk-pill mk-pill--run">In corso</span>
                </li>
                <li class="mk-step">
                  <span class="mk-node"><svg class="mk-ico" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></span>
                  <div><div class="mk-b">Controllo sul gestionale</div><div class="mk-s">Integrazione ERP</div></div>
                  <span class="mk-pill mk-pill--wait">In coda</span>
                </li>
                <li class="mk-step">
                  <span class="mk-node"><svg class="mk-ico" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.6 3.4-5.5 6.5-5.5 1.5 0 2.9.4 4 1.3M15.5 18.5l2 2 4-4"/></svg></span>
                  <div><div class="mk-b">Approvazione</div><div class="mk-s">Responsabile acquisti</div></div>
                  <span class="mk-pill mk-pill--wait">In attesa</span>
                </li>
              </ol>
            </div>

            <div class="mk-panel mk-sources">
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email</span>
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>ERP</span>
              <span class="mk-src"><svg class="mk-ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5M16 4.5a3 3 0 0 1 0 6M18 15c1.6.6 2.7 2.2 3 5"/></svg>CRM</span>
            </div>

            <div class="mk-panel mk-approve">
              <div class="mk-approve-head">
                <span class="mk-avatar"><svg class="mk-ico" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.9-3.6 3.7-5.5 7-5.5s6.1 1.9 7 5.5"/></svg></span>
                <div><div class="mk-b">Approvazione richiesta</div><div class="mk-s">Ordine 4821 · fornitore abituale</div></div>
              </div>
              <div class="mk-rows">
                <div class="mk-row"><span>Righe estratte</span><b>12 di 12</b></div>
                <div class="mk-row"><span>Prezzi a listino</span><b>Conformi</b></div>
                <div class="mk-row"><span>Anagrafica</span><b>Verificata</b></div>
              </div>
              <div class="mk-actions"><span class="mk-btn mk-btn--primary">Approva</span><span class="mk-btn mk-btn--ghost">Rivedi</span></div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <script>
      document.querySelectorAll('.slot').forEach((s) => s.appendChild(document.getElementById(s.dataset.tpl).content.cloneNode(true)));
    </script>
  </body>
</html>
