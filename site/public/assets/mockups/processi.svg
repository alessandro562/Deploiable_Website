<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" fill="none">
  <!-- 01 · processi. Tre blocchi in fila: il processo del cliente, l'AI che lo porta in produzione,
       l'approvazione della persona. Sotto, il prodotto su misura chiavi in mano.
       Nessun testo: le icone si leggono in italiano e in inglese. Colori: Forest, Lime (solo l'AI), Mist, Sage. -->

  <!-- ombra a terra, una sola luce dall'alto a sinistra -->
  <ellipse cx="280" cy="194" rx="258" ry="10" fill="#10261B" opacity="0.08"/>

  <!-- collegamenti tra i blocchi -->
  <path d="M176 154H214M346 154H384" stroke="#10261B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="176" cy="154" r="3.5" fill="#10261B"/>
  <circle cx="214" cy="154" r="3.5" fill="#10261B"/>
  <circle cx="346" cy="154" r="3.5" fill="#10261B"/>
  <circle cx="384" cy="154" r="3.5" fill="#10261B"/>

  <!-- 1 · processo: il documento -->
  <path d="M44 124H176L162 110H58Z" fill="#DDE3D6"/>
  <rect x="44" y="124" width="132" height="60" rx="10" fill="#C9D1C2"/>
  <rect x="94" y="142" width="32" height="26" rx="4" stroke="#10261B" stroke-width="2"/>
  <path d="M102 151H118M102 157H118M102 163H112" stroke="#10261B" stroke-width="2" stroke-linecap="round"/>

  <!-- 2 · AI: il blocco scuro con il piano in Lime e la scintilla -->
  <path d="M214 124H346L332 110H228Z" fill="#C8F25A"/>
  <rect x="214" y="124" width="132" height="60" rx="10" fill="#10261B"/>
  <path d="M280 136Q283 151 298 154Q283 157 280 172Q277 157 262 154Q277 151 280 136Z" fill="#C8F25A"/>
  <circle cx="300" cy="138" r="3" fill="#C8F25A"/>

  <!-- 3 · approvazione: la persona, con il segno di conferma -->
  <path d="M384 124H516L502 110H398Z" fill="#B9C6BA"/>
  <rect x="384" y="124" width="132" height="60" rx="10" fill="#8FA596"/>
  <circle cx="446" cy="146" r="7" stroke="#10261B" stroke-width="2"/>
  <path d="M434 166Q446 150 458 166" stroke="#10261B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="466" cy="164" r="9" fill="#F1F3EA" stroke="#10261B" stroke-width="1.6"/>
  <path d="M461.5 164L464.5 167L470.5 161" stroke="#10261B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- prodotto su misura, chiavi in mano -->
  <rect x="44" y="226" width="472" height="44" rx="22" fill="#E2E7DB"/>
  <rect x="60" y="238" width="22" height="20" rx="4" fill="#10261B"/>
  <rect x="60" y="244" width="22" height="4" fill="#C8F25A"/>
  <rect x="98" y="244" width="150" height="8" rx="4" fill="#10261B"/>
  <rect x="264" y="244" width="78" height="8" rx="4" fill="#8FA596"/>
  <circle cx="494" cy="248" r="8" fill="#C8F25A"/>
  <circle cx="494" cy="248" r="3" fill="#10261B"/>
</svg>
