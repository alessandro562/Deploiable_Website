<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deploiable · We deploy AI. Measurably.</title>
    <meta name="description" content="We deploy AI. Measurably." />
    <meta name="theme-color" content="#10261B" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Deploiable · We deploy AI. Measurably." />
    <meta property="og:description" content="We deploy AI. Measurably." />
    <meta property="og:image" content="%VITE_SITE_URL%og.jpg" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <noscript>
      <style>
        .line { transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <canvas class="gl" aria-hidden="true"></canvas>
    <i class="sweep" aria-hidden="true"></i>
    <main class="stack">
      <!-- Il segnaposto del logo: nella versione 3D la camera finale lo inquadra esattamente qui;
           nella versione statica è il logo ufficiale. -->
      <div class="logo-slot"><!-- logo:static-logo --></div>
      <h1 class="claim">
        <span class="mask"><span class="line line--light" lang="en">We deploy AI.</span></span>
        <span class="mask"><span class="line line--black" lang="en">Measurably.</span></span>
      </h1>
      <div class="outro" lang="en">
        <p class="soon"><i class="soon-dot" aria-hidden="true"></i>Coming soon</p>
        <form class="signup" novalidate>
          <label class="sr-only" for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" required autocomplete="email" inputmode="email" spellcheck="false" placeholder="your@email.com" />
          <!-- trappola per i bot: invisibile alle persone -->
          <input class="hp" name="_gotcha" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <button type="submit">Notify me</button>
        </form>
        <p class="signup-note" role="status" aria-live="polite">Be the first to know when we launch. No spam.</p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
